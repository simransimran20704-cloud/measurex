name = "measurex"
pages_build_output_dir = "dist"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Cloudflare D1 Database Binding
# Replace database_id with your real D1 GUID generated from:
#   npx wrangler d1 create measurex-db
[[d1_databases]]
binding = "DB"
database_name = "measurex-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Cloudflare R2 Private Storage Bucket Binding
# Ensure this bucket is created via:
#   npx wrangler r2 bucket create measurex-documents
[[r2_buckets]]
binding = "DOCUMENTS_VAULT"
bucket_name = "measurex-documents"
